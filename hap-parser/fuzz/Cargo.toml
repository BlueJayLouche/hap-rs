[package]
name = "hap-parser-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
hap-parser = { path = ".." }

[[bin]]
name = "parse_frame"
path = "fuzz_targets/parse_frame.rs"
